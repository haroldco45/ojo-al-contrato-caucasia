name: Robot SECOP Caucasia

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-secop
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer contratos y noticias
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node scripts/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-ojo-al-contrato"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Robot: actualiza contratos SECOP $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
